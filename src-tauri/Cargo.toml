[package]
name = "myoscleaner"
version = "1.0.0"
description = "Universal Cross-Platform System Cleaner, Memory Optimizer & Space Management Suite for macOS, Windows & Linux"
authors = ["Uchit Chakma <uchitchakma.com>", "UCDREAMS TECHNOLOGIES LLP <ucdreams.com>"]
edition = "2021"

[lib]
name = "myoscleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
walkdir = "2.5"
rayon = "1.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
